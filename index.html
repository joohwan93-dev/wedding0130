<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>우리의 결혼식</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f8f5f1;
            font-family: Arial, sans-serif;
            text-align: center;
            color: #333;
        }

        .container {
            padding: 40px 25px;
        }

        h1 {
            font-size: 28px;
            font-weight: 400;
            margin-bottom: 20px;
        }

        p {
            line-height: 1.8;
            color: #777;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>우리의 결혼식</h1>

        <p>
            소중한 분들을 모시고<br>
            행복한 시작을 준비하고 있습니다.
        </p>

        <p>
            모바일 청첩장을 준비 중입니다.
        </p>
    </div>

</body>
</html>
